name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile backend/*.py benchroom.py llm_concurrency_bench.py
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Check browser bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check web/app.js

