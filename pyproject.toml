[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-concurrency-bench"
version = "0.1.0"
description = "A local-first browser workbench for measuring concurrent LLM throughput"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
benchroom = "benchroom:main"
llm-concurrency-bench = "llm_concurrency_bench:main"

[tool.setuptools]
packages = ["backend"]
py-modules = ["benchroom", "llm_concurrency_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
